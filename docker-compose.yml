services:
  ringing-stats-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ringing-stats-ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    networks:
      - ringing-stats-network

  # Development service for local development with hot-reload
  ringing-stats-ui-dev:
    image: node:18-alpine
    container_name: ringing-stats-ui-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    networks:
      - ringing-stats-network
    profiles:
      - dev

networks:
  ringing-stats-network:
    driver: bridge
